# ComponentBuilder descriptor of <Tabs> (docs/component-builder.md, ADR 0031).
# A wrapper: its own props here, its repeatable <Tab> child under `children:`.
# The selection prop and omission policy are declared under children.selection.
label: Onglets
description: Regrouper du contenu en onglets
previewHeight: 300px
properties:
  display:
    label: Apparence
    type: list
    default: segmented
    options:
      segmented: Segments
      separated: Pastilles
      underline: Soulignement
      folder: Dossiers
  orientation:
    label: Orientation
    type: list
    default: horizontal
    options:
      horizontal: Horizontale
      vertical: Verticale
  fullWidth:
    label: Onglets sur toute la largeur
    type: checkbox
    default: false
    # Sans objet en vertical : les onglets y occupent déjà toute la largeur.
    showif:
      orientation: horizontal
children:
  component: Tab
  label: Onglet
  collectionLabel: Onglets
  selection:
    prop: default
    initial: first
  singleChildWarning: Ce groupe ne contient qu'un onglet et n'apporte donc aucune navigation. Vous pouvez afficher directement son titre et son contenu.
  anchorField: title
  initialContent: Contenu de l'onglet à modifier
  properties:
    title:
      label: Titre
      type: text
      required: true
      initialValue: Titre de mon onglet
    icon:
      label: Icône
      type: icon
