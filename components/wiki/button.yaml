# ComponentBuilder descriptor of <Button> (docs/component-builder.md).
label: Bouton
description: Créer un bouton cliquable
previewHeight: 100px
properties:
  text:
    label: Texte du bouton
    type: text
    value: Mon bouton
  link:
    label: Lien web ou nom d'une page de ce wiki
    hint: Si lien web, n'oubliez pas le "https://"
    type: page-list
    required: true
  icon:
    label: Icône
    type: icon
  color:
    label: Couleur
    type: list
    options:
      default: Défaut
      primary: Primaire
      secondary-1: Secondaire 1
      secondary-2: Secondaire 2
      success: Succès
      info: Info
      warning: Attention
      danger: Danger
      link: Lien
  title:
    label: Texte affiché au survol
    type: text
    advanced: true
  popup:
    label: Ouvrir le contenu du lien dans une popup
    hint: Fonctionne vers une page de ce wiki
    type: list
    advanced: true
    options:
      none: Non
      click: Lors du clic
      hover: Au survol
  newWindow:
    label: Ouvrir dans une nouvelle fenêtre
    type: checkbox
    advanced: true
    showif:
      popup: none
  float:
    label: Position
    type: list
    advanced: true
    options:
      none: Par défaut
      right: Droite
  fullWidth:
    label: Toute la largeur
    type: checkbox
    advanced: true
    showif:
      float: none
